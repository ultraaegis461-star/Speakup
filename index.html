<style>

<script>
const $=(s,e=document)=>e.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const SK='speakup-demo-v1',DAY=864e5,MB=1048576;
const ST={menunggu:'Menunggu',diproses:'Diproses',selesai:'Selesai',ditolak:'Ditolak'},IC={menunggu:'clock',diproses:'loader',selesai:'check-circle-2',ditolak:'x-circle'};
const TR={menunggu:['diproses','ditolak'],diproses:['selesai','ditolak'],selesai:[],ditolak:[]};
const SUB={'Sarana & Prasarana':['Ruang kelas','Toilet','Listrik / AC','Jaringan Wi-Fi','Lainnya'],'Bullying':['Verbal','Fisik','Perundungan siber','Pengucilan','Lainnya']};
//<API  — lapisan layanan: padanan Controller/Service/Policy Laravel. Semua aturan bisnis ada di sini, bukan di UI.
let DB;const fails={};
const sha=async t=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t)))].map(b=>b.toString(16).padStart(2,'0')).join('');
const save=()=>{try{localStorage.setItem(SK,JSON.stringify(DB))}catch(e){}};
const today=()=>new Date().toISOString().slice(0,10),yymm=t=>{const d=new Date(t);return String(d.getFullYear()).slice(2)+String(d.getMonth()+1).padStart(2,'0')};
const gate=k=>{const f=fails[k];if(f&&f.n>=5&&Date.now()-f.t<3e4)throw Error('Terlalu banyak percobaan. Coba lagi dalam 30 detik.')},bad=k=>{const f=fails[k]=fails[k]||{n:0,t:0};f.n++;f.t=Date.now()};
const mkcode=()=>{const a='ABCDEFGHJKMNPQRSTUVWXYZ23456789',r=crypto.getRandomValues(new Uint8Array(12));return[...r].map(x=>a[x%a.length]).join('').replace(/(.{4})(?=.)/g,'$1-')};
const vd=(f,s)=>{const e={};if(!f.cat)e.cat='Pilih jenis laporan.';if(s>=1){if(f.title.trim().length<5)e.title='Judul minimal 5 karakter.';if(!f.sub)e.sub='Pilih subkategori.';if(!f.loc.trim())e.loc='Isi lokasi kejadian.';if(f.date&&f.date>today())e.date='Tanggal tidak boleh di masa depan.';if(f.desc.trim().length<20)e.desc='Deskripsi minimal 20 karakter.'}return e};
async function seed(){const n=Date.now(),U=[{id:1,role:'admin',name:'Admin SpeakUp',email:'admin@speakup.test',pw:'admin123'},{id:2,role:'mhs',name:'Rani Putri',nim:'2024001',email:'rani@kampus.test',kelas:'TI-1A',pw:'demo123'},{id:3,role:'mhs',name:'Dimas Pratama',nim:'2024002',email:'dimas@kampus.test',kelas:'TI-1B',pw:'demo123'}];
const rows=[['Proyektor ruang B204 mati','Sarana & Prasarana','Listrik / AC','Gedung B, R. 204',2,150,'selesai'],['Keran toilet lantai 2 bocor','Sarana & Prasarana','Toilet','Gedung A, lt. 2',2,118,'selesai'],['Wi-Fi perpustakaan sering putus','Sarana & Prasarana','Jaringan Wi-Fi','Perpustakaan',3,86,'selesai'],['AC ruang C101 tidak dingin','Sarana & Prasarana','Listrik / AC','Gedung C, R. 101',2,55,'diproses'],['Kursi kelas patah','Sarana & Prasarana','Ruang kelas','Gedung A, R. 105',3,32,'ditolak'],['Ejekan berulang di grup angkatan','Bullying','Perundungan siber','Grup chat angkatan',null,20,'diproses','DEMO-AAAA-0001'],['Lampu koridor padam','Sarana & Prasarana','Listrik / AC','Gedung B, lt. 1',2,6,'menunggu'],['Dikucilkan saat kerja kelompok','Bullying','Pengucilan','Ruang diskusi',null,2,'menunggu','DEMO-AAAA-0002']];
const R=[];for(const[i,r]of rows.entries()){const t=n-r[5]*DAY,h=[{t,s:'menunggu',fb:'Laporan diterima.',by:'Sistem'}],s=r[6];
if(s!='menunggu')h.push({t:t+DAY,s:s=='ditolak'?'ditolak':'diproses',fb:s=='ditolak'?'Contoh penolakan pada data demo.':'Laporan ditinjau dan diteruskan ke unit terkait.',by:'Admin SpeakUp',chg:1});
if(s=='selesai')h.push({t:t+(2+i%3)*DAY,s:'selesai',fb:'Penanganan telah selesai (data demo).',by:'Admin SpeakUp',chg:1});
R.push({id:i+1,no:`SU-${yymm(t)}-${String(i+1).padStart(3,'0')}`,title:r[0],cat:r[1],sub:r[2],loc:r[3],date:'',desc:'Contoh deskripsi laporan untuk keperluan demonstrasi. Data ini bukan laporan nyata.',status:s,anon:!r[4],uid:r[4],hash:r[7]?await sha(r[7]):null,created:t,doneAt:s=='selesai'?h[2].t:null,files:[],hist:h,demo:true})}
return{users:U,reports:R}}
const API={
login(role,id,pw){gate('l');const u=DB.users.find(u=>u.role==role&&(role=='mhs'?u.nim==id.trim():u.email==id.trim().toLowerCase())&&u.pw==pw&&u.active!==false);if(!u){bad('l');throw Error('NIM/email atau password tidak sesuai.')}return u},
async create(me,f){if(me?.role!='mhs')throw Error('Tidak diizinkan.');if(Object.keys(vd(f,3)).length)throw Error('Data belum valid.');
 if(f.files.length>3||f.files.some(x=>x.size>2*MB||!/^image\/(jpeg|png|webp)$/.test(x.type)))throw Error('Lampiran tidak valid.');
 const anon=f.cat=='Bullying'&&!!f.anon,id=DB.reports.length+1,now=Date.now(),code=anon?mkcode():null;
 const r={id,no:`SU-${yymm(now)}-${String(id).padStart(3,'0')}`,title:f.title.trim(),cat:f.cat,sub:f.sub,loc:f.loc.trim(),date:f.date,desc:f.desc.trim(),status:'menunggu',anon,uid:anon?null:me.id,hash:anon?await sha(code):null,created:now,doneAt:null,files:f.files.map((x,i)=>({name:'bukti-'+(i+1),size:x.size})),hist:[{t:now,s:'menunggu',fb:'Laporan diterima.',by:'Sistem'}]};
 DB.reports.push(r);save();return{r,code}},
mine:uid=>DB.reports.filter(r=>r.uid==uid),
get(me,id){const r=DB.reports.find(x=>x.id==id);if(!r||!me||(me.role=='mhs'&&r.uid!==me.id))return null;return r},
async track(code){gate('t');const h=await sha(String(code).trim().toUpperCase()),r=DB.reports.find(r=>r.anon&&r.hash==h);if(!r){bad('t');throw Error('Kode tidak ditemukan. Periksa kembali penulisannya.')}return r},
act(me,id,status,fb){if(me?.role!='admin')throw Error('Tidak diizinkan.');const r=DB.reports.find(x=>x.id==id);if(!r)throw Error('Laporan tidak ditemukan.');fb=(fb||'').trim();if(!fb)throw Error('Feedback wajib diisi.');
 if(status){if(!TR[r.status].includes(status))throw Error(`Status ${ST[r.status]} tidak dapat diubah menjadi ${ST[status]}.`);r.status=status;if(status=='selesai')r.doneAt=Date.now()}
 r.hist.push({t:Date.now(),s:r.status,fb,by:me.name,chg:!!status});save()}};
//API>
const BL={};let S={view:'landing',role:'mhs',user:null,q:{s:'',c:'',t:'',o:'new',p:1},f:null,step:0,err:{},fe:'',done:null,rid:null,trk:null};
const newF=()=>({cat:'',anon:false,title:'',sub:'',loc:'',date:'',desc:'',files:[]}),dirty=()=>S.f&&(S.f.title||S.f.desc||S.f.loc||S.f.files.length);
const ic=n=>`<i data-lucide="${n}" aria-hidden="true"></i>`,pill=s=>`<span class="pill ${s}">${ic(IC[s])}${ST[s]}</span>`;
const fd=(t,tm)=>new Date(t).toLocaleString('id-ID',tm?{day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}:{day:'numeric',month:'short',year:'numeric'});
const cnt=(rs,s)=>rs.filter(r=>r.status==s).length,who=r=>r.anon?'Pelapor anonim':esc(DB.users.find(u=>u.id==r.uid)?.name);
function toast(m,e){const t=document.createElement('div');t.className='toast'+(e?' e':'');t.textContent=m;$('#toasts').append(t);setTimeout(()=>t.remove(),4200)}
function modal(t,body,btns){const op=document.activeElement,o=document.createElement('div');o.className='mo';o.innerHTML=`<div class="md" role="dialog" aria-modal="true" aria-labelledby="mt"><h3 id="mt">${t}</h3><div>${body}</div><div class="mf"></div></div>`;const mf=$('.mf',o);
const close=()=>{o.remove();document.removeEventListener('keydown',kd);op?.focus?.()};
const kd=e=>{if(e.key=='Escape')close();if(e.key=='Tab'){const f=[...o.querySelectorAll('button,input,select,textarea,a[href]')].filter(x=>!x.disabled),a=f[0],z=f.at(-1);if(e.shiftKey&&document.activeElement==a){e.preventDefault();z.focus()}else if(!e.shiftKey&&document.activeElement==z){e.preventDefault();a.focus()}}};
btns.forEach(b=>{const x=document.createElement('button');x.className='btn '+(b.c||'');x.textContent=b.l;x.onclick=()=>{close();b.f&&b.f()};mf.append(x)});
document.addEventListener('keydown',kd);o.onclick=e=>{if(e.target==o)close()};document.body.append(o);lucide?.createIcons?.();mf.lastChild.focus()}
const go=(v,x={})=>{S.view=v;Object.assign(S,x);render();scrollTo(0,0)};
const NAV={mhs:[['m-dash','layout-dashboard','Dashboard'],['m-baru','square-pen','Buat Pengaduan'],['m-hist','history','Histori'],['track','search','Lacak Anonim']],admin:[['a-dash','layout-dashboard','Dashboard'],['a-list','inbox','Semua Pengaduan']]};

const ACT={
nav:d=>go(d.v),drawer:()=>$('.shell')?.classList.toggle('open'),col:()=>{S.col=!S.col;$('.shell').classList.toggle('col')},
start:d=>{if(S.user?.role=='mhs'){S.f=newF();S.step=0;S.err={};if(d.c)S.f.cat=d.c;go('m-baru')}else{toast('Masuk sebagai mahasiswa untuk membuat pengaduan.');go('login')}},
role:d=>go('login',{role:d.v}),rf:()=>{S.q={s:'',c:'',t:'',o:'new',p:1};render()},pg:d=>{S.q.p+=+d.d;drawList()},
open:d=>go(S.user.role=='admin'?'a-det':'m-det',{rid:+d.id}),
cat:d=>{S.f.cat=d.v;S.f.sub='';if(d.v!='Bullying')S.f.anon=false;S.err={};render()},
pick:()=>$('#fi').click(),rmf:d=>{S.f.files.splice(+d.i,1);S.fe='';render()},
prev:()=>{S.step--;S.err={};render()},next:()=>{const e=vd(S.f,S.step);S.err=e;if(Object.keys(e).length){render();return}S.step++;S.err={};render();scrollTo(0,0)},
submit:()=>modal('Kirim laporan?',`<p>Laporan <b>${esc(S.f.title)}</b> akan dikirim ke admin${S.f.anon?' secara anonim':''}. Setelah dikirim, isi laporan tidak dapat diubah.</p>`,[{l:'Periksa lagi'},{l:'Ya, kirim',c:'p',f:async()=>{try{const d=await API.create(S.user,S.f);BL[d.r.id]=S.f.files.map(x=>x.url);S.done=d;S.f=null;toast('Laporan berhasil dikirim.');go('m-done')}catch(e){toast(e.message,1)}}}]),
copy:async()=>{try{await navigator.clipboard.writeText($('#cd').textContent);toast('Kode disalin.')}catch(e){toast('Salin manual: blok teks kode lalu salin.',1)}},
logout:()=>{const out=()=>{S.user=null;S.f=null;S.done=null;S.trk=null;go('landing');toast('Anda telah keluar.')};dirty()?modal('Keluar sekarang?','<p>Formulir yang belum dikirim akan hilang.</p>',[{l:'Batal'},{l:'Keluar',c:'d',f:out}]):out()},
reset:()=>modal('Atur ulang data demo?','<p>Semua laporan yang Anda buat di peramban ini akan dihapus dan data demo dipulihkan.</p>',[{l:'Batal'},{l:'Atur ulang',c:'d',f:async()=>{DB=await seed();save();toast('Data demo dipulihkan.');render()}}])};
const FM={
login(f){const d=new FormData(f);try{const u=API.login(S.role,d.get('id')||'',d.get('pw')||'');S.user=u;S.q={s:'',c:'',t:'',o:'new',p:1};toast('Selamat datang, '+u.name+'.');go(u.role=='admin'?'a-dash':'m-dash')}catch(e){$('#lerr').textContent=e.message}},
async track(f){try{S.trk=await API.track(new FormData(f).get('c')||'');render()}catch(e){S.trk=null;render();$('#terr').textContent=e.message}},
act(f,ev){const m=ev.submitter?.value,st=m=='status'?f.st.value:'',fb=f.fb.value,er=$('#aerr');er.textContent='';
if(m=='status'&&!st){er.textContent='Pilih status baru.';return}if(!fb.trim()){er.textContent='Feedback wajib diisi.';f.fb.classList.add('inv');return}
const r=API.get(S.user,S.rid);modal('Konfirmasi perubahan',`<p>${st?`Status: ${pill(r.status)} → ${pill(st)}`:'Hanya menambah feedback (status tidak berubah).'}</p><p class="note">${esc(fb)}</p>`,[{l:'Batal'},{l:'Simpan',c:'p',f:()=>{try{API.act(S.user,S.rid,st,fb);toast(st?'Status diperbarui.':'Feedback ditambahkan.');render()}catch(e){toast(e.message,1)}}}])}};
document.addEventListener('click',e=>{const a=e.target.closest('[data-a]');if(!a)return;if(a.dataset.a=='nav'){$('.shell')?.classList.remove('open')}ACT[a.dataset.a]?.(a.dataset,a)});
document.addEventListener('keydown',e=>{const a=e.target.closest?.('[data-a=open],[data-a=pick]');if(a&&(e.key=='Enter'||e.key==' ')){e.preventDefault();a.click()}});
document.addEventListener('submit',e=>{e.preventDefault();FM[e.target.dataset.f]?.(e.target,e)});
document.addEventListener('input',e=>{const t=e.target;if(t.id=='qs'){S.q.s=t.value;S.q.p=1;drawList();return}if(t.dataset.k&&S.f&&S.view=='m-baru'){S.f[t.dataset.k]=t.type=='checkbox'?t.checked:t.value;if(t.id=='desc')$('#c-desc').textContent=t.value.length+'/1000'}});
document.addEventListener('change',e=>{const t=e.target;if(t.id=='fi'){addF(t.files);t.value=''}else if(t.dataset.k&&S.q&&['c','t','o'].includes(t.dataset.k)){S.q[t.dataset.k]=t.value;S.q.p=1;drawList()}else if(t.dataset.k&&S.f){S.f[t.dataset.k]=t.type=='checkbox'?t.checked:t.value}});
document.addEventListener('dragover',e=>{if(e.target.closest?.('.dz')){e.preventDefault();e.target.closest('.dz').classList.add('ov')}});
document.addEventListener('dragleave',e=>e.target.closest?.('.dz')?.classList.remove('ov'));
document.addEventListener('drop',e=>{if(e.target.closest?.('.dz')){e.preventDefault();addF(e.dataTransfer.files)}});
function addF(l){const f=S.f;S.fe='';for(const x of l){if(f.files.length>=3){S.fe='Maksimal 3 foto.';break}if(!/^image\/(jpeg|png|webp)$/.test(x.type)){S.fe=`“${x.name}” bukan JPG, PNG, atau WebP.`;continue}if(x.size>2*MB){S.fe=`“${x.name}” melebihi 2 MB.`;continue}x.url=URL.createObjectURL(x);f.files.push(x)}render()}
window.addEventListener('beforeunload',e=>{if(dirty()){e.preventDefault()}});
(async()=>{try{DB=JSON.parse(localStorage.getItem(SK))}catch(e){}if(!DB||!DB.users)DB=await seed();render()})();
</script></body></html>
